name: Deploy Worker

on:
  workflow_dispatch:

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  iperf3:
    name: iperf3 fallback (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.9.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build native static iperf3
        env:
          IPERF3_ARCH: ${{ matrix.arch }}
        run: node controller/scripts/build-iperf3.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iperf3-${{ matrix.arch }}
          path: controller/frontend/dist/_deps/hlg-iperf3-linux-${{ matrix.arch }}

  deploy:
    needs: iperf3
    runs-on: ubuntu-latest
    environment: cloudflare-env
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.7.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.9.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: agent/go.sum

      - name: Test
        run: |
          pnpm -C controller test
          pnpm -C controller typecheck
          pnpm -C controller/frontend test
          pnpm -C controller/frontend typecheck
          pnpm -C controller/frontend build

      - name: Test (Go agent)
        working-directory: agent
        run: |
          go vet ./...
          go test ./...

      - name: Build
        run: pnpm -C controller build

      - name: Download iperf3 binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: iperf3-*
          merge-multiple: true
          path: controller/frontend/dist/_deps

      - name: Verify and index iperf3 binaries
        run: |
          node controller/scripts/build-iperf3.mjs --manifest-only
          node controller/scripts/verify-release-artifacts.mjs

      - name: Generate Wrangler config
        working-directory: controller
        env:
          WORKER_NAME: ${{ secrets.WORKER_NAME }}
          D1_NAME: ${{ secrets.D1_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          # Optional cron schedule override (comma-separated; "none" disables).
          WORKER_CRONS: ${{ vars.WORKER_CRONS }}
        run: pnpm wrangler:config

      - name: Deploy Worker
        working-directory: controller
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.jsonc --autoconfig=false --keep-vars
