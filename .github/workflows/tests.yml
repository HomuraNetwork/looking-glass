name: Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Controller & frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.7.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.9.0
          cache: pnpm

      - name: Setup Go (cross-language bundle verification)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: agent/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Worker test & typecheck
        run: |
          pnpm -C controller test
          pnpm -C controller typecheck
          pnpm -C controller typecheck:local

      - name: Frontend test, typecheck & build
        run: |
          pnpm -C controller/frontend test
          pnpm -C controller/frontend typecheck
          pnpm -C controller/frontend build

  docker:
    name: Controller image (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        run: docker buildx build --load -f Dockerfile -t hlg-controller:ci .

      - name: Verify release assets in the runtime image
        run: docker run --rm --entrypoint node -v "$PWD/controller/scripts:/verify:ro" hlg-controller:ci /verify/verify-release-artifacts.mjs /app/assets

  iperf3:
    name: iperf3 fallback (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.9.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and smoke-test native static iperf3
        env:
          IPERF3_ARCH: ${{ matrix.arch }}
        run: |
          node controller/scripts/build-iperf3.mjs
          file controller/frontend/dist/_deps/hlg-iperf3-linux-${IPERF3_ARCH}

  go:
    name: Agent (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: agent/go.sum

      - name: Vet & test
        working-directory: agent
        run: |
          go vet ./...
          go test ./...
