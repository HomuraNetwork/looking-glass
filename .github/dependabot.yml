# Dependabot configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# The root pnpm workspace owns the lockfile for controller and frontend. The Go
# module and node image live in agent/; the complete controller image is at root.
version: 2

updates:
  # ── GitHub Actions (workflow action pins) ──────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # ── JavaScript / TypeScript (pnpm workspace: controller + frontend) ────────
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: scope
    groups:
      # Batch compatible minor/patch bumps; major bumps stay as individual PRs
      # because they need review against the Cloudflare Workers runtime.
      npm-production:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ── Go agent ───────────────────────────────────────────────────────────────
  - package-ecosystem: gomod
    directory: "/agent"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "deps"
      include: scope
    groups:
      go-dependencies:
        patterns:
          - "*"

  # ── Docker base images ─────────────────────────────────────────────────────
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "deps"
      include: scope

  - package-ecosystem: docker
    directory: "/agent"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "deps"
      include: scope

  - package-ecosystem: docker
    directory: "/controller/deps"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "deps"
      include: scope
